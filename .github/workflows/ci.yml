# Type-check, build, then unit and integration tests (no secrets needed: tests use in-memory sheets).
#   push to any branch except main, and pull requests -> runs here
#   push to main / tags -> runs as the first job of docker.yml, which only builds the image if it passes
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration
